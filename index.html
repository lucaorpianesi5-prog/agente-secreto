<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agente Secreto">
<meta name="theme-color" content="#ECEEF1">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Agente Secreto</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Concepto: expediente. Gris diplomático, barras de censura negras y un único rojo para sellos (condecoraciones y casos cerrados). */
:root{
  --bg:#ECEEF1; --surface:#FFFFFF; --surface-2:#F4F5F7;
  --ink:#14171C; --ink-2:#444C58; --muted:#5F6773;
  --line:#D8DCE2; --line-strong:#B6BCC7;
  --focus:#2F5BEA; --stamp:#B3261E; --grid:rgba(20,23,28,.045);
  --good:#1B6E43; --good-bg:#DDF0E5;
  --warn:#8F5200; --warn-bg:#FAEBD2;
  --bad:#A6221A; --bad-bg:#F9DEDB;
  --btn-bg:#14171C; --btn-fg:#FFFFFF;
  --font-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --font-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1217; --surface:#171B22; --surface-2:#1F242D;
    --ink:#ECEEF1; --ink-2:#B7BECA; --muted:#8E96A4;
    --line:#2A303B; --line-strong:#434B59;
    --focus:#8FA8FF; --stamp:#E5604F; --grid:rgba(255,255,255,.045);
    --good:#6FD39B; --good-bg:#143324;
    --warn:#F0B35A; --warn-bg:#3A2B12;
    --bad:#FF9A8F; --bad-bg:#3D1A16;
    --btn-bg:#ECEEF1; --btn-fg:#0F1217;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1217; --surface:#171B22; --surface-2:#1F242D;
  --ink:#ECEEF1; --ink-2:#B7BECA; --muted:#8E96A4;
  --line:#2A303B; --line-strong:#434B59;
  --focus:#8FA8FF; --stamp:#E5604F; --grid:rgba(255,255,255,.045);
  --good:#6FD39B; --good-bg:#143324;
  --warn:#F0B35A; --warn-bg:#3A2B12;
  --bad:#FF9A8F; --bad-bg:#3D1A16;
  --btn-bg:#ECEEF1; --btn-fg:#0F1217;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:16px/1.45 var(--font-body); font-variant-numeric:tabular-nums;
  padding-block:14px 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
h1,h2,h3,p,ul,ol{margin:0}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card-t{font:700 22px/1.1 var(--font-display);letter-spacing:.015em;text-transform:uppercase}
.sec{font:600 12px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:8px 2px -6px}
.hint{color:var(--ink-2);font-size:14px;margin-top:6px}
.help{color:var(--muted);font-size:12.5px;margin-top:6px}
.lbl{font:600 13px/1.3 var(--font-body);color:var(--ink-2)}
.xp{font-weight:500;font-size:12.5px;opacity:.8}
.err{color:var(--bad);font-size:13.5px;margin-top:10px}
.warn-line{color:var(--warn);background:var(--warn-bg);font-size:13px;border-radius:8px;padding:8px 10px;margin-top:8px}

/* estado: cinturón, XP y racha */
.status{position:relative;overflow:hidden;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:100% 28px,56px 100%;background-color:var(--surface)}
.status-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.eyebrow{font:600 12px/1 var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.today-xp{font:600 13px/1 var(--font-body);color:var(--ink-2)}
.agent{display:flex;gap:16px;align-items:center;margin-top:16px}
.crest{display:block;width:72px;height:72px;flex:none}
.agent-txt{min-width:0;display:flex;flex-direction:column;gap:6px}
.alias{display:flex;align-items:center;gap:8px;font:500 10px/1 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.redact{display:block;width:110px;height:12px;background:var(--ink);border-radius:2px}
.lvl-name{font:800 30px/1 var(--font-display);letter-spacing:.01em;text-transform:uppercase;overflow-wrap:anywhere}
.lvl-n{color:var(--ink-2);font:500 12px/1.2 var(--font-mono);letter-spacing:.04em}
.xpbar{height:10px;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:99px;overflow:hidden;margin-top:14px}
.xpfill{height:100%;background:var(--ink);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.xp-meta{display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:7px}
.streak{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.streak-n{display:flex;align-items:baseline;gap:8px;color:var(--ink-2);font-size:13px}
.streak-n .big{font:800 46px/.9 var(--font-display);color:var(--ink)}
.best{font-size:12.5px;color:var(--muted);margin-top:4px}
.week{display:flex;gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.wd i{display:block;width:20px;height:20px;border-radius:5px;border:1.5px solid var(--line-strong)}
.wd.on i{background:var(--ink);border-color:var(--ink)}
.wd.now{color:var(--ink);font-weight:700}
.wd.now i{border-color:var(--ink)}

/* formularios */
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px;min-width:0}
.field label{font:600 13px/1.3 var(--font-body);color:var(--ink-2)}
input[type=text],textarea{
  font:16px/1.4 var(--font-body);color:var(--ink);background:var(--surface-2);
  border:1px solid var(--line-strong);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:72px}
::placeholder{color:var(--muted);opacity:.85}
.checks{display:flex;flex-direction:column;gap:2px}
.check{display:flex;align-items:center;gap:10px;min-height:40px;font-size:15px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--ink);flex:none;margin:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg-b{font:500 14px/1 var(--font-body);min-height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer}
.seg-b.on{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg)}
.btn{font:600 15px/1 var(--font-body);min-height:46px;padding:0 18px;border-radius:8px;border:1px solid var(--btn-bg);background:var(--btn-bg);color:var(--btn-fg);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.link{background:none;border:0;padding:6px 0;font:500 13px/1 var(--font-body);color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;white-space:nowrap}
.link.danger{color:var(--bad)}

.chip{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--font-body);padding:6px 10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.chip.good{background:var(--good-bg);color:var(--good);border-color:transparent}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chips{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.btn-chip{cursor:pointer;font-weight:500;font-size:13.5px;line-height:1.3;text-align:left;border-radius:10px;padding:8px 12px;max-width:100%}

/* hoy */
.mission{font:600 20px/1.25 var(--font-body);margin-top:10px;overflow-wrap:anywhere}
.bet-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.bet{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:92px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink);cursor:pointer}
.bet:active{transform:scale(.98)}
.bet-n{font:800 40px/1 var(--font-display)}
.bet-l{font:600 13px/1 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.bet-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--ink-2)}
.row{border-bottom:1px solid var(--line)}
.row:last-of-type{border-bottom:0}
.row-h{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 0;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.mark{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center;flex:none}
.mark.done{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-fg)}
.row-txt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.row-t{font-weight:600}
.row-s{font-size:13px;color:var(--muted)}
.row-xp{font-size:12px;color:var(--muted);white-space:nowrap}
.chev{display:grid;color:var(--muted);transition:transform .2s}
.chev.up{transform:rotate(180deg)}
.row-b{padding:2px 0 18px}
.night .card-t{margin-bottom:4px}
.saved{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.saved li{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.saved-b{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0}
.saved-b p{overflow-wrap:anywhere}
.close{margin-top:14px}
.closed{display:flex;gap:12px;align-items:center;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.steps{padding-left:20px;display:flex;flex-direction:column;gap:8px;margin-top:10px;color:var(--ink-2)}
.steps b{color:var(--ink)}

/* hipótesis */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:8px 2px -6px}
.sec-head .sec{margin:0}
.count{font:600 12px/1 var(--font-body);color:var(--muted)}
.hyp-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hyp-top .help{margin:0 0 0 auto}
.see{margin-top:12px;overflow-wrap:anywhere}
.ab{display:grid;grid-template-columns:30px 1fr;gap:10px;margin-top:14px;align-items:start}
.ab .tag{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font:800 16px/1 var(--font-display)}
.ab.win .tag{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg)}
.ab-t{font-weight:600;overflow-wrap:anywhere}
.ab .help{margin-top:2px;overflow-wrap:anywhere}
.resolve{margin-top:16px;padding-top:6px;border-top:1px dashed var(--line-strong)}
.fb{margin-top:14px;font-size:13.5px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:10px 12px}
.ex{border-style:dashed;border-color:var(--line-strong);background:transparent}
.empty{color:var(--ink-2);font-size:14px}

/* perfil */
.ladder{list-style:none;padding:0;margin-top:12px;display:flex;flex-direction:column}
.ladder li{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--ink-2)}
.ladder li:last-child{border-bottom:0}
.ladder .sw{display:block;width:34px;height:34px;flex:none}
.ladder li{align-items:flex-start}
.ladder .rk-s{display:block;font:500 11px/1.3 var(--font-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:3px;font-weight:500}
.ladder .rk-d{display:block;font-size:13px;font-weight:400;color:var(--ink-2);margin-top:2px}
.ladder li.lock{opacity:.7}
.ladder .nm{flex:1;min-width:0}
.ladder .xv{font-size:12px;color:var(--muted)}
.ladder li.cur{color:var(--ink);font-weight:700}
.ladder li.past{color:var(--muted)}
.dl{display:grid;grid-template-columns:1fr auto;gap:0 16px;margin:10px 0 0}
.dl dt,.dl dd{margin:0;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.dl dt{color:var(--ink-2)}
.dl dd{font-weight:600;text-align:right}
.dl dt:nth-last-of-type(1),.dl dd:last-of-type{border-bottom:0}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:12px}
.ach{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px}
.ach.off{border-style:dashed;background:transparent}
.ach-n{font-weight:700;font-size:14.5px}
.ach-d{font-size:12.5px;color:var(--muted);margin-top:2px}
.ach-p{font-size:12px;color:var(--ink-2);margin-top:4px;font-weight:600}
.stamp{width:52px;height:52px;border-radius:6px;display:grid;place-items:center;flex:none;border:2px dashed var(--line-strong);color:var(--line-strong)}
.stamp.on{border:2.5px solid var(--stamp);color:var(--stamp);transform:rotate(-7deg);box-shadow:inset 0 0 0 3px var(--surface),inset 0 0 0 4.5px var(--stamp)}
.how summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}
.how ul{list-style:none;padding:0;margin-top:4px}
.how li{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--ink-2)}
.how li b{color:var(--ink);white-space:nowrap}
.how li:last-child{border-bottom:0}
.note{font-size:13.5px;color:var(--ink-2);margin-top:10px}
.banner{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:12px 14px;font-size:14px;font-weight:500}
.skel{height:14px;border-radius:6px;background:var(--surface-2);margin-top:12px}

/* navegación y avisos */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;border:0;border-radius:8px;background:none;color:var(--muted);font:600 12px/1 var(--font-body);cursor:pointer}
.tab[aria-selected=true]{color:var(--ink);background:var(--surface-2)}
.badge{position:absolute;top:5px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--btn-bg);color:var(--btn-fg);font:700 11px/18px var(--font-body);text-align:center}
#toasts{position:fixed;left:0;right:0;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.toast{background:var(--btn-bg);color:var(--btn-fg);border-radius:10px;padding:10px 16px;font-weight:600;display:flex;align-items:center;gap:12px;max-width:420px;box-shadow:0 6px 24px rgba(0,0,0,.28);animation:tin .25s ease-out}
.toast.xp{font:800 24px/1 var(--font-display);letter-spacing:.02em}
.toast.err{background:var(--bad);color:#fff}
.toast-t{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.toast-s{font:800 20px/1.1 var(--font-display);text-transform:uppercase}
.toast-crest{width:52px;height:52px;flex:none}
.toast.level{padding:12px 18px}
.toast .stamp{width:42px;height:42px;border:2px solid currentColor;color:var(--btn-fg);transform:none;box-shadow:none}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app" role="tabpanel" aria-live="off"></div>
<nav class="tabbar" id="tabs" aria-label="Secciones"></nav>
<div id="toasts" aria-live="polite"></div>

<script>
(function(){
'use strict';

/*PURE-START*/
var SHIFT_H=4;
function pad(n){return String(n).padStart(2,'0');}
function keyOf(date){var t=new Date(date.getTime()-SHIFT_H*3600000);return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());}
function today(){return keyOf(new Date());}
function addDays(key,n){var p=key.split('-').map(Number);var t=new Date(p[0],p[1]-1,p[2]+n,12);return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());}

/* Racha: días cerrados seguidos. Un día suelto sin cerrar se perdona una vez cada 7 días. */
function streakFrom(anchor,closed){
  var cur=closed.has(anchor)?anchor:addDays(anchor,-1);
  var streak=0,i=0,lastSkip=-99;
  for(var guard=0;guard<3000;guard++){
    if(closed.has(cur)){streak++;}
    else if(i-lastSkip>=7&&closed.has(addDays(cur,-1))){lastSkip=i;}
    else break;
    i++;cur=addDays(cur,-1);
  }
  return streak;
}

var LEVELS=[
  {name:'Irregular de Baker Street',xp:0,num:'I',src:'Sherlock Holmes · Arthur Conan Doyle',desc:'Los chicos que Holmes mandaba a mirar donde nadie miraba. Empezás a notar.'},
  {name:'Agente 86',xp:250,num:'II',src:'Get Smart · Maxwell Smart',desc:'Primeras lecturas. Todavía te equivocás, pero ya lo anotás.'},
  {name:'Doble cero',xp:700,num:'III',src:'James Bond · Ian Fleming',desc:'Licencia para observar: salidas, manos, quién mira a quién.'},
  {name:'Bourne',xp:1500,num:'IV',src:'Jason Bourne · Robert Ludlum',desc:'Entrás a un lugar y ya tenés el mapa: accesos, gente, anomalías.'},
  {name:'Smiley',xp:3000,num:'V',src:'George Smiley · John le Carré',desc:'Paciencia y archivo. Escuchás más de lo que hablás y cruzás datos.'},
  {name:'Holmes',xp:5500,num:'VI',src:'Sherlock Holmes · Arthur Conan Doyle',desc:'Observación y deducción con método. Dudás de tus propias hipótesis.'}
];
function levelFor(xp){var l=0;for(var i=0;i<LEVELS.length;i++){if(xp>=LEVELS[i].xp)l=i;}return l;}

/* El XP se deriva siempre de lo registrado: nada se guarda como contador. */
function dayXp(d){
  var x=0;
  if(d.mission){x+=10;if(d.mission.done)x+=10;}
  (d.details||[]).slice(0,3).forEach(function(t){x+=10;if(t.checks&&t.checks.length===3&&t.checks.every(Boolean))x+=5;});
  if(d.pattern){x+=15;if(d.pattern.seen3)x+=5;}
  if(d.anomaly){x+=d.anomaly.none?5:15;}
  x+=Math.min((d.baselines||[]).length,3)*5;
  var b=d.bets||{};x+=Math.min((b.hit||0)+(b.miss||0),10)*3;
  if(d.closed)x+=10;
  return x;
}

var ACH=[
  {id:'first',name:'Primer informe',desc:'Cerrá tu primer día.',icon:'calendar',target:1,cur:function(s){return s.closedKeys.length;}},
  {id:'s3',name:'Tres seguidos',desc:'Cobertura de 3 días.',icon:'flame',target:3,cur:function(s){return s.best;}},
  {id:'s7',name:'Cobertura sólida',desc:'Cobertura de 7 días.',icon:'flame',target:7,cur:function(s){return s.best;}},
  {id:'s14',name:'Quincena',desc:'Cobertura de 14 días.',icon:'flame',target:14,cur:function(s){return s.best;}},
  {id:'s30',name:'Agente de carrera',desc:'Cobertura de 30 días.',icon:'flame',target:30,cur:function(s){return s.best;}},
  {id:'tr',name:'Ojo de entrenador',desc:'10 detalles de entrenamiento.',icon:'eye',target:10,cur:function(s){return s.details.entrenamiento||0;}},

  {id:'bets',name:'Ojo de halcón',desc:'20 lecturas de campo con 60 % de aciertos o más.',icon:'target',target:20,cur:function(s){return s.betsTotal;},extra:function(s){return s.betsTotal>0&&s.betsHit/s.betsTotal>=0.6;}}
];
function achDone(a,s){return a.cur(s)>=a.target&&(!a.extra||a.extra(s));}

function computeStatsFrom(days,hyps,tk){
  var st={xp:0,todayXp:0,closedKeys:[],details:{entrenamiento:0,mostrador:0,caminata:0,otro:0},detailsTotal:0,
    patterns:0,anomalies:0,noneAnoms:0,baselines:0,betsHit:0,betsTotal:0,missionsSet:0,missionsDone:0,
    hypCreated:0,hypResolved:0,aciertos:0,errores:0,conLean:0,discr:0,weak:0,noConcl:0};
  Object.keys(days).forEach(function(k){
    var d=days[k];var dk=d.date||k;
    var x=dayXp(d);st.xp+=x;if(dk===tk)st.todayXp+=x;
    if(d.closed)st.closedKeys.push(dk);
    (d.details||[]).forEach(function(t){st.detailsTotal++;st.details[t.area]=(st.details[t.area]||0)+1;});
    if(d.pattern)st.patterns++;
    if(d.anomaly){if(d.anomaly.none)st.noneAnoms++;else st.anomalies++;}
    st.baselines+=(d.baselines||[]).length;
    var b=d.bets||{};st.betsHit+=b.hit||0;st.betsTotal+=(b.hit||0)+(b.miss||0);
    if(d.mission){st.missionsSet++;if(d.mission.done)st.missionsDone++;}
  });
  var perDate={};
  Object.keys(hyps).map(function(k){return hyps[k];}).sort(function(a,b){return (a.at||0)-(b.at||0);}).forEach(function(hy){
    st.hypCreated++;
    perDate[hy.created]=(perDate[hy.created]||0)+1;
    if(perDate[hy.created]<=2){st.xp+=30;if(hy.created===tk)st.todayXp+=30;}
    if(hy.status==='resolved'&&hy.result){
      var r=hy.result;st.hypResolved++;
      var rx=20+((r.outcome!=='none'&&r.discriminated===true)?10:0);
      st.xp+=rx;if(r.date===tk)st.todayXp+=rx;
      if(r.outcome==='none'){st.noConcl++;}
      else{
        if(r.discriminated===true)st.discr++;else if(r.discriminated===false)st.weak++;
        if(hy.lean==='A'||hy.lean==='B'){st.conLean++;if(hy.lean===r.outcome)st.aciertos++;else st.errores++;}
      }
    }
  });
  var closed=new Set(st.closedKeys);
  st.streak=streakFrom(tk,closed);
  var best=st.streak;
  st.closedKeys.forEach(function(k){var s=streakFrom(k,closed);if(s>best)best=s;});
  st.best=best;
  st.level=levelFor(st.xp);
  st.ach=ACH.filter(function(a){return achDone(a,st);}).map(function(a){return a.id;});
  return st;
}

function ResolveForm(hy){
  var f='res-'+hy.id;var oc=getDraft(f,'outcome');
  return h('div',{class:'resolve'},
    h('div',{class:'field'},h('span',{class:'lbl'},'¿Qué pasó?'),seg(f,'outcome',[['A','Fue A'],['B','Fue B'],['none','No concluyente']],null)),
    (oc==='A'||oc==='B')?h('div',{class:'field'},h('span',{class:'lbl'},'¿El resultado habría sido distinto si fuera la otra explicación?'),
      seg(f,'dist',[['yes','Sí, distinto'],['no','No, igual']],null),
      h('p',{class:'help'},'Si habría dado igual, la prueba no decidió nada.')):null,
    textInput(f,'note','Qué viste (opcional)',{area:true,rows:2}),
    errLine(f),
    h('div',{class:'btn-row'},
      actionBtn('Guardar resultado','+20 a +30 XP',function(){
        var o=getDraft(f,'outcome'),dist=getDraft(f,'dist');
        if(!o){S.err[f]='Elegí qué pasó.';render();return;}
        if((o==='A'||o==='B')&&!dist){S.err[f]='Contestá si el resultado habría sido distinto con la otra explicación.';render();return;}
        var note=(getDraft(f,'note')||'').trim();
        var before=computeStats();
        hy.status='resolved';
        hy.result={outcome:o,discriminated:o==='none'?null:dist==='yes',note:note,date:today(),at:Date.now()};
        S.resolving=null;clearDraft(f);persistHyp(hy.id);afterChange(before);
      }),
      actionBtn('Cancelar',null,function(){S.resolving=null;clearDraft(f);render();},true)));
}
function HypCard(hy){
  var res=hy.status==='resolved'?hy.result:null;
  var chip;
  if(!res)chip=h('span',{class:'chip'},'Abierta');
  else if(res.outcome==='none')chip=h('span',{class:'chip'},'No concluyente');
  else if(hy.lean==='A'||hy.lean==='B')chip=hy.lean===res.outcome?h('span',{class:'chip good'},'Acierto'):h('span',{class:'chip warn'},'Me equivoqué');
  else chip=h('span',{class:'chip'},'Sin inclinación previa');
  function ab(tag,exp,test){
    return h('div',{class:'ab'+(res&&res.outcome===tag?' win':'')},h('span',{class:'tag'},tag),
      h('div',null,h('p',{class:'ab-t'},exp+(hy.lean===tag?' · me inclinaba':'')),h('p',{class:'help'},'Si es '+tag+', voy a ver: '+test)));
  }
  var card=h('article',{class:'card'},
    h('div',{class:'hyp-top'},chip,(res&&res.discriminated===false)?h('span',{class:'chip warn'},'Prueba débil'):null,h('span',{class:'help'},fmtDate(hy.created))),
    h('p',{class:'see'},hy.see),
    ab('A',hy.a,hy.ifA),ab('B',hy.b,hy.ifB));
  if(res){
    if(res.note)card.append(h('p',{class:'fb'},'Lo que viste: '+res.note));
    var fb='';
    if(res.discriminated===false)fb='El resultado habría sido igual con la otra explicación. La próxima, buscá una prueba que cambie según cuál sea.';
    else if(res.outcome!=='none'&&(hy.lean==='A'||hy.lean==='B')&&hy.lean!==res.outcome)fb='Ganó la explicación que no preferías. Es el aprendizaje más útil: ¿qué te hizo inclinarte por la otra?';
    else if(res.outcome==='none')fb='Sin conclusión también es un resultado. ¿Qué prueba podrías sumar para decidir?';
    if(fb)card.append(h('p',{class:'fb'},fb));
  }else{
    if(S.resolving===hy.id)card.append(ResolveForm(hy));
    else card.append(h('div',{class:'btn-row'},
      actionBtn('Resolver',null,function(){S.resolving=hy.id;S.confirm=null;render();}),
      QuitBtn('hyp-'+hy.id,function(){var before=computeStats();removeHyp(hy.id);afterChange(before);})));
  }
  return card;
}

async function exportData(){
  try{
    await DL.save({filename:'agente-secreto-'+today()+'.json',data:JSON.stringify({exportado:new Date().toISOString(),dias:S.days,hipotesis:S.hyps},null,2)});
    toast({kind:'info',text:'Copia guardada.'});
  }catch(e){if(!e||e.code!=='declined')toast({kind:'err',text:'No se pudo guardar la copia.'});}
}

/* ---------- navegación y render ---------- */
var TABS=[['hoy','Hoy','lupa'],['hip','Casos','carpeta'],['perfil','Perfil','carnet']];
function go(k){S.tab=k;S.open=null;S.confirm=null;render();window.scrollTo(0,0);}
function renderTabs(){
  var openCount=Object.keys(S.hyps).filter(function(k){return S.hyps[k].status!=='resolved';}).length;
  $('#tabs').replaceChildren(h('div',{class:'tabbar-in',role:'tablist','aria-label':'Secciones'},TABS.map(function(t){
    return h('button',{type:'button',role:'tab',class:'tab','aria-selected':String(S.tab===t[0]),onclick:function(){go(t[0]);}},
      h('span',{html:icon(t[2],22)}),h('span',null,t[1]),(t[0]==='hip'&&openCount)?h('span',{class:'badge'},String(openCount)):null);
  })));
}
function Loading(){
  return h('header',{class:'status card'},h('h1',{class:'eyebrow'},'Agente secreto'),h('p',{class:'lvl-name',style:'margin-top:16px'},'Cargando…'),h('div',{class:'skel'}),h('div',{class:'skel',style:'width:60%'}));
}
function render(){
  S.lastKey=today();
  var act=document.activeElement;var fk=act&&act.dataset?act.dataset.fk:null;var ss=null,se=null;
  if(fk&&act.selectionStart!=null){ss=act.selectionStart;se=act.selectionEnd;}
  var app=$('#app');
  if(!S.ready){app.replaceChildren(Loading());renderTabs();return;}
  var st=computeStats();S.st=st;
  var view=S.tab==='hoy'?Hoy(st):S.tab==='hip'?Hipotesis():Perfil(st);
  var kids=[Status(st),S.dbError?h('div',{class:'banner',role:'alert'},'Se perdió la conexión con el guardado. Recargá la página antes de seguir anotando.'):null,view].filter(Boolean);
  app.replaceChildren.apply(app,kids);
  renderTabs();
  if(fk){
    var el=document.querySelector('[data-fk="'+fk+'"]');
    if(el){el.focus({preventScroll:true});if(ss!=null){try{el.setSelectionRange(ss,se);}catch(e){}}}
  }
}

async function init(){
  render();
  var db=null;
  try{if(window.claude&&window.claude.use)db=await window.claude.use('db');}catch(e){}
  if(db){DB=db;S.mode='db';subscribe();}
  else{
    S.mode='local';var o=lsLoad();S.days=o.days||{};S.hyps=o.hyps||{};S.got={days:true,hyps:true};S.ready=true;render();
  }
  try{if(window.claude&&window.claude.use){DL=await window.claude.use('downloads');if(DL&&S.ready)render();}}catch(e){}
}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&S.ready&&today()!==S.lastKey)render();});
setInterval(function(){if(S.ready&&today()!==S.lastKey)render();},60000);
init();
})();
</script>
